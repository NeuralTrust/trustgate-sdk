name: Release

# One tag publishes both packages: v0.2.0 releases @neuraltrust/trustgate 0.2.0
# to npm and trustgate-sdk 0.2.0 to PyPI. Neither registry holds a token for this
# repository; both trust this workflow through OIDC (trusted publishing), so
# there is no secret to leak and every artifact carries provenance back to the
# commit and the run that built it.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches both packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(jq -r .version typescript/package.json)
          py_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)
          py_runtime=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/trustgate/__init__.py)
          echo "tag=$tag npm=$npm_version pyproject=$py_version __version__=$py_runtime"
          if [ "$tag" != "$npm_version" ] || [ "$tag" != "$py_version" ] || [ "$tag" != "$py_runtime" ]; then
            echo "::error::tag v$tag does not match the package versions; bump them before tagging"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.20"
          python-version: "3.13"
      - name: TypeScript
        working-directory: typescript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          mkdir -p ../dist/npm
          npm pack --pack-destination ../dist/npm
      - name: Python
        working-directory: python
        run: |
          uv sync --locked --extra dev
          uv run --locked pytest
          uv build --out-dir ../dist/pypi
          uvx twine@7.0.0 check --strict ../dist/pypi/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trustgate-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/
          # A re-run after a partial failure publishes what is missing.
          skip-existing: true

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@neuraltrust/trustgate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships 10.x. Pinned,
      # because whatever npm this job installs is what publishes the package.
      - run: npm install -g npm@11.21.0
      - name: Publish, unless this version is already on npm
        # Already there means a re-run after a partial failure, or the first
        # version published by hand to create the package (see CONTRIBUTING).
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if npm view "@neuraltrust/trustgate@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@neuraltrust/trustgate@$VERSION is already published"
            exit 0
          fi
          npm publish dist/npm/*.tgz --access public --provenance

  github-release:
    name: GitHub release
    needs: [verify, pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the release with both artifacts attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --generate-notes \
            dist/npm/*.tgz dist/pypi/*

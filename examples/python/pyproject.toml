[project]
name = "trustgate-examples"
version = "0.1.0"
description = "Runnable TrustGate SDK examples."
requires-python = ">=3.10"
dependencies = [
    "trustgate",
    # batch.py judges each row with a model, end_user_agent.py answers one user.
    "anthropic>=0.40",
    # framework_mcp.py hands the endpoint to a framework that speaks MCP itself.
    # Any of them would do; this one is a single dependency with a native
    # streamable-HTTP client.
    "pydantic-ai-slim[mcp,openai]>=2.46",
]

# The SDK is not on PyPI yet, so the examples take it from this repository.
# Editable on purpose: a non-editable path install is built once and cached
# against the version, so editing the SDK and re-running would keep running the
# build from before. Swap this block for a version pin once it is published.
[tool.uv.sources]
trustgate = { path = "../../python", editable = true }

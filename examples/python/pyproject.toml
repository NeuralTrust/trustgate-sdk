[project]
name = "trustgate-examples"
version = "0.1.0"
description = "Runnable TrustGate SDK examples."
requires-python = ">=3.10"
dependencies = [
    "trustgate",
    # Only end_user_agent.py needs it; kept here so one `uv sync` runs everything.
    "anthropic>=0.40",
]

# The SDK is not on PyPI yet, so the examples build it from this repository.
# Swap this block for a version pin once it is published.
[tool.uv.sources]
trustgate = { path = "../../python" }
